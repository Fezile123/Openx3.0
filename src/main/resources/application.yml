spring:
  application:
    name: openex
  datasource:
    url: jdbc:postgresql://localhost:5432/openex
    username: openex
    password: openex
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
server:
  port: 8080
logging:
  level:
    com.openex: DEBUG
    org.hibernate.SQL: DEBUG